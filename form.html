<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fixed: Expanded description to 50-160 characters -->
    <meta name="description"
        content="A comprehensive product review form for users to rate, evaluate, and provide feedback on their recently purchased sci-fi gadgets.">
    <!-- Fixed: Added Meta Author -->
    <meta name="author" content="Franklin Anyaogu">

    <title>Product Review - Sci-Fi Breakdowns</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Fixed: Updated paths to match the course's required folder names -->
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Sci-Fi Gadget Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">

            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-stars">
                    <!-- Fixed: Added 'required' to all radios and explicit 'for' attributes to labels -->
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">1 &star;</label>

                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2">2 &star;</label>

                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3">3 &star;</label>

                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4">4 &star;</label>

                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">5 &star;</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful?</legend>
                <div class="checkbox-group">
                    <!-- Fixed: Added explicit 'for' attributes to labels -->
                    <input type="checkbox" id="feature1" name="features" value="durability">
                    <label for="feature1">Durability</label>

                    <input type="checkbox" id="feature2" name="features" value="ease-of-use">
                    <label for="feature2">Ease of Use</label>

                    <input type="checkbox" id="feature3" name="features" value="performance">
                    <label for="feature3">Performance</label>

                    <input type="checkbox" id="feature4" name="features" value="design">
                    <label for="feature4">Design</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="reviewText">Written Review</label>
                <textarea id="reviewText" name="reviewText" rows="4" placeholder="Share your thoughts..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" name="userName" placeholder="e.g. Marty McFly">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sci-Fi Cinematic Breakdowns | WDD 131</p>
    </footer>
</body>

</html>
