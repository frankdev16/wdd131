<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sci-Fi Gadget Product Review Form">
    <title>Product Review - Sci-Fi Breakdowns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/form.css">
    <script src="js/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Sci-Fi Gadget Review </h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">

            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-stars">
                    <!-- Note how the 'name' is the same for all 5 so they group together -->
                    <label><input type="radio" id="star1" name="rating" value="1" required> 1 &star;</label>
                    <label><input type="radio" id="star2" name="rating" value="2"> 2 &star;</label>
                    <label><input type="radio" id="star3" name="rating" value="3"> 3 &star;</label>
                    <label><input type="radio" id="star4" name="rating" value="4"> 4 &star;</label>
                    <label><input type="radio" id="star5" name="rating" value="5"> 5 &star;</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="feature1" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="feature2" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" id="feature3" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" id="feature4" name="features" value="design"> Design</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="reviewText">Written Review</label>
                <textarea id="reviewText" name="reviewText" rows="4" placeholder="Share your thoughts..."></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" name="userName" placeholder="e.g. Marty McFly">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sci-Fi Cinematic Breakdowns | WDD 131</p>
    </footer>
</body>

</html>
