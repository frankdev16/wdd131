<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="auto">

  <!-- Background -->
  <rect width="800" height="600" fill="#121212" stroke="#00FFCC" stroke-width="4"/>


  <!-- Header & Nav -->
  <rect x="20" y="20" width="760" height="60" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="400" y="55" fill="#E0E0E0" font-family="Orbitron, sans-serif" font-size="20" text-anchor="middle">Sci-Fi Breakdowns &#160; | &#160; Home &#160; Library &#160; Requests</text>
  
  <!-- Hero Banner -->
  <rect x="20" y="100" width="760" height="200" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="400" y="205" fill="#00FFCC" font-family="Roboto, sans-serif" font-size="24" text-anchor="middle">Hero Image: Timeline Graphic for Interstellar or Inception</text>
  
  <!-- Main Content (Left Side) -->
  <rect x="20" y="320" width="480" height="180" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="260" y="415" fill="#E0E0E0" font-family="Roboto, sans-serif" font-size="20" text-anchor="middle">Recent Breakdowns (e.g., Tenet, Arrival)</text>
  
  <!-- Main Content (Right Side) -->
  <rect x="520" y="320" width="260" height="180" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="650" y="415" fill="#E0E0E0" font-family="Roboto, sans-serif" font-size="20" text-anchor="middle">Filter by: Space, Time Travel</text>
  
  <rect x="20" y="520" width="760" height="60" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="400" y="555" fill="#E0E0E0" font-family="Roboto, sans-serif" font-size="20" text-anchor="middle">Footer Information</text>
</svg>