<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="100%" height="auto">
  <!-- Background -->
  <rect width="300" height="600" fill="#121212" stroke="#00FFCC" stroke-width="4"/>
  
  <!-- Header & Nav -->
  <rect x="10" y="10" width="280" height="50" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="150" y="40" fill="#E0E0E0" font-family="sans-serif" font-size="16" text-anchor="middle">Sci-Fi Breakdowns (Hamburger Menu)</text>
  
  <!-- Hero Banner -->
  <rect x="10" y="70" width="280" height="150" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="150" y="150" fill="#00FFCC" font-family="sans-serif" font-size="16" text-anchor="middle">Hero Image: Complex Plot Graphic</text>
  
  <!-- Content Section 1 -->
  <rect x="10" y="230" width="280" height="120" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="150" y="295" fill="#E0E0E0" font-family="sans-serif" font-size="16" text-anchor="middle">Latest Movie Explanation</text>
  
  <!-- Content Section 2 -->
  <rect x="10" y="360" width="280" height="120" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="150" y="425" fill="#E0E0E0" font-family="sans-serif" font-size="16" text-anchor="middle">Request a Breakdown Form</text>
  
  <!-- Footer -->
  <rect x="10" y="490" width="280" height="100" fill="#1E1E1E" stroke="#E0E0E0" stroke-width="1"/>
  <text x="150" y="545" fill="#E0E0E0" font-family="sans-serif" font-size="16" text-anchor="middle">Footer Information</text>
</svg>
