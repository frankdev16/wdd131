<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Information, demographics, and weather data for Calabar, Nigeria.">
    <meta name="author" content="Franklin Anyaogu">
    <title>Calabar, Nigeria | WDD 131</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <span id="header-title">CALABAR - NIGERIA</span>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source media="(min-width:1000px )" srcset="images/crossriver-large.webp">
                <source media="(min-width:500px)" srcset="images/crossriver-medium.webp">
                <img src="images/crossriver-small.webp" alt="crossriver nigeria pic" width="500" height="250">
            </picture>
        </div>
        <section class="sec1">
            <h2>Data</h2>
            <dl>
                <div class="data-row">
                    <dt>Area:</dt>
                    <dd>20,156 sq km</dd>
                </div>
                <div class="data-row">
                    <dt>Population:</dt>
                    <dd>4,406,200</dd>
                </div>
                <div class="data-row">
                    <dt>Capital:</dt>
                    <dd>Calabar</dd>
                </div>
                <div class="data-row">
                    <dt>Languages:</dt>
                    <dd>English, Efik</dd>
                </div>
                <div class="data-row">
                    <dt>Currency:</dt>
                    <dd>Nigerian Naira (NGN)</dd>
                </div>
                <div class="data-row">
                    <dt>Time Zone:</dt>
                    <dd>UTC+1 (WAT)</dd>
                </div>
                <div class="data-row">
                    <dt>Calling Code:</dt>
                    <dd>+234</dd>
                </div>
                <div class="data-row">
                    <dt>Internet TLD:</dt>
                    <dd>.ng</dd>
                </div>
            </dl>
        </section>
        
        <section class="sec2">
            <h2>Weather</h2>
            <img src="images/weather.svg" alt="weather icon" class="weather-icon">
            <dl>
                <div class="data-row">
                    <dt>Temperature:</dt>
                    <dd>31 °C</dd>
                </div>
                <div class="data-row">
                    <dt>Conditions:</dt>
                    <dd>Partly Cloudy</dd>
                </div>
                <div class="data-row">
                    <dt>Wind:</dt>
                    <dd>11 km/h</dd>
                </div>
                <div class="data-row">
                    <dt>Wind Chill:</dt>
                    <dd id="windChill">N/A</dd>
                </div>
            </dl>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
